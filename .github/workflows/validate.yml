name: 플러그인 검증

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: 저장소 통합 검증
        run: python scripts/validate_all.py

      - name: validator 단위 테스트
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: live eval 구성 검증
        run: python scripts/live_eval.py validate

      - name: 플러그인 버전 증가 검증
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/check_version_bumps.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Bash 업데이트 스크립트 검증
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/update_plugins.sh
          ./scripts/update_plugins.sh --dry-run

      - name: ShellCheck 정적 분석
        if: runner.os == 'Linux'
        shell: bash
        run: shellcheck scripts/update_plugins.sh

      - name: PowerShell 업데이트 스크립트 검증
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/update_plugins.ps1 -DryRun

  browser-e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: 브라우저 테스트 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: Interactive Slides 브라우저 계약 검증
        run: npm run test:browser

      - name: 실패 진단 자료 업로드
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interactive-slides-browser-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
