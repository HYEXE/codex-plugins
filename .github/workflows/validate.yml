name: 플러그인 검증

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 설정
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: 저장소 통합 검증
        run: python scripts/validate_all.py

      - name: Bash 업데이트 스크립트 검증
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/update_plugins.sh
          ./scripts/update_plugins.sh --dry-run

      - name: PowerShell 업데이트 스크립트 검증
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/update_plugins.ps1 -DryRun
