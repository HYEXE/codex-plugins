name: 플러그인 Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 생성할 stable tag
        required: true
        type: string
      commit:
        description: 검증하고 release할 main의 전체 commit SHA
        required: true
        type: string
      local_live_eval_confirmed:
        description: 입력한 로컬 live eval run이 release gate를 통과했는지 확인
        required: true
        type: boolean
        default: false
      local_live_eval_model:
        description: 로컬 live eval model ID
        required: true
        type: string
        default: gpt-5.6-sol
      local_live_eval_codex_version:
        description: 로컬 live eval Codex CLI version
        required: true
        type: string
        default: codex-cli 0.147.0
      local_live_eval_run_ids:
        description: routing critical/full, tool-trace critical/full 순서의 쉼표 구분 run ID
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release 준비 검증
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0

      - name: release 대상 고정
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit은 40자리 소문자 SHA여야 합니다." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo "checkout 결과가 요청한 commit과 다릅니다." >&2
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" != "$RELEASE_COMMIT" ]; then
            echo "release 대상은 현재 origin/main HEAD여야 합니다." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "이미 존재하는 immutable tag입니다: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Python 설정
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: tag 명세와 공개 배포 준비 상태 검증
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/validate_release_tag.py --tag "$RELEASE_TAG"
          python scripts/check_release_readiness.py
          python scripts/validate_all.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: 로컬 live eval 확인 자료 검증
        shell: bash
        env:
          LOCAL_LIVE_EVAL_CONFIRMED: ${{ inputs.local_live_eval_confirmed }}
          LOCAL_LIVE_EVAL_MODEL: ${{ inputs.local_live_eval_model }}
          LOCAL_LIVE_EVAL_CODEX_VERSION: ${{ inputs.local_live_eval_codex_version }}
          LOCAL_LIVE_EVAL_RUN_IDS: ${{ inputs.local_live_eval_run_ids }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$LOCAL_LIVE_EVAL_CONFIRMED" != "true" ]; then
            echo "로컬 live eval release gate 통과 확인이 필요합니다." >&2
            exit 1
          fi
          python scripts/create_release_attestation.py \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --model "$LOCAL_LIVE_EVAL_MODEL" \
            --codex-version "$LOCAL_LIVE_EVAL_CODEX_VERSION" \
            --run-ids "$LOCAL_LIVE_EVAL_RUN_IDS" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output local-live-eval-attestation.json

  publish:
    name: GitHub Release 생성
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0

      - name: publish 대상 고정
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit은 40자리 소문자 SHA여야 합니다." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo "checkout 결과가 요청한 commit과 다릅니다." >&2
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" != "$RELEASE_COMMIT" ]; then
            echo "release 대상은 현재 origin/main HEAD여야 합니다." >&2
            exit 1
          fi

      - name: Release metadata와 로컬 live eval attestation 생성
        env:
          LOCAL_LIVE_EVAL_MODEL: ${{ inputs.local_live_eval_model }}
          LOCAL_LIVE_EVAL_CODEX_VERSION: ${{ inputs.local_live_eval_codex_version }}
          LOCAL_LIVE_EVAL_RUN_IDS: ${{ inputs.local_live_eval_run_ids }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/validate_release_tag.py --tag "$RELEASE_TAG" --json > release-metadata.json
          python scripts/create_release_attestation.py \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --model "$LOCAL_LIVE_EVAL_MODEL" \
            --codex-version "$LOCAL_LIVE_EVAL_CODEX_VERSION" \
            --run-ids "$LOCAL_LIVE_EVAL_RUN_IDS" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output local-live-eval-attestation.json

      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current_main" != "$RELEASE_COMMIT" ]; then
            echo "release gate 실행 중 main이 변경되어 release를 중단합니다." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "이미 존재하는 immutable tag입니다: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --generate-notes \
            --title "$RELEASE_TAG" \
            release-metadata.json \
            local-live-eval-attestation.json
