name: 기능 제안
description: 플러그인, 평가 또는 운영 흐름의 개선을 제안해 주세요.
title: "feat: "
body:
  - type: dropdown
    id: area
    attributes:
      label: 대상 영역
      options:
        - prompt-compiler
        - uiux-advisor
        - 검증 또는 평가
        - 설치 또는 업데이트
        - Release 또는 GitHub Actions
        - 저장소 운영
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 한계가 있는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 결과
      description: 구현 방식보다 사용자가 얻게 될 동작과 완료 기준을 중심으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 이미 시도한 방법이나 고려한 대안이 있다면 적어 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 issue와 roadmap에서 같은 제안을 찾지 못했습니다.
          required: true
        - label: 제안에 비밀정보와 개인정보가 없습니다.
          required: true
